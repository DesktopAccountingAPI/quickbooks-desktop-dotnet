name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: mise run check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The library targets netstandard2.0 and net8.0; both are built and tested on Linux and Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run check
